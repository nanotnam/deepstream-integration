schema: mbfs.deepstream-pipeline/v1
source:
  id: replay-01
  type: file
  uri_env: ALPR_SOURCE_URI
  width: 1920
  height: 1080
  framerate: 30
  latency_ms: 0
models:
  bundle: 1.0.0
  precision: fp16
  engine_root: .local/engines
tracker:
  type: nvdcf
  config: /opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvDCF_perf.yml
processing:
  max_fps: 0
  plate_batch_size: 1
  lpr_batch_size: 1
  job_queue_capacity: 256
  queue_overflow: block
alpr:
  vehicle_threshold: 0.6
  plate_threshold: 0.3
  vehicle_iou_threshold: 0.3
  plate_iou_threshold: 0.4
  minimum_finalize_observations: 3
  maximum_values_per_index: 10
  character_lock_confidence: 0.9
  recognition_zone: [[0,0],[1,0],[1,1],[0,1]]
outputs:
  stdout:
    enabled: true
  kafka:
    enabled: true
    brokers_env: ALPR_KAFKA_BROKERS
    event_topic: mbfs.alpr.events.v1
    health_topic: mbfs.alpr.health.v1
health:
  interval_seconds: 5
