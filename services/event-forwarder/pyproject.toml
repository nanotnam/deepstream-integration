[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbfs-event-forwarder"
version = "0.1.0"
description = "Forward versioned Kafka events to an idempotent HTTP backend"
requires-python = ">=3.11"
dependencies = ["confluent-kafka>=2.6", "jsonschema>=4.23"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
event-forwarder = "event_forwarder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
